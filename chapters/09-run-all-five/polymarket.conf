; Chapter 9: supervisord keeps portfolio_manager.py running on your server.
; Copy to /etc/supervisor/conf.d/polymarket.conf, type your keys between the quotes
; (or leave one empty), then: sudo chmod 600 /etc/supervisor/conf.d/polymarket.conf
[program:portfolio_manager]
command=/home/user/polymarket-bots/.venv/bin/python -u portfolio_manager.py
directory=/home/user/polymarket-bots
autostart=true
autorestart=true
stderr_logfile=/var/log/polymarket/error.log
stdout_logfile=/var/log/polymarket/output.log
environment=ANTHROPIC_API_KEY="",NEWS_API_KEY=""
